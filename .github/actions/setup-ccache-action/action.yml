name: 'Setup CCache'
inputs:
  ccache-path:  # id of input
    required: true
    default: '/usr/lib/ccache'
runs:
  using: "composite"
  steps:
      - name: Setup CCache
        shell: bash
        env:
          CCACHE_PATH: ${{ inputs.ccache-path }}
        run: |
          # Prepend the ccache shims for every later step via GITHUB_PATH; no
          # eval of interpolated input.
          echo "$CCACHE_PATH" >> "$GITHUB_PATH"
          cat <<EOF >>"$GITHUB_ENV"
          CCACHE_MAXSIZE=500M
          CCACHE_DIR=$HOME/.cache/ccache
          CCACHE_BASEDIR=$PWD
          EOF
      - name: Cache compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          # The key carries the SHA because a cache entry is immutable once saved:
          # the old fixed key froze the first run's objects forever. `-sha-` is a
          # delimiter, not decoration: `ubuntu-22.04` is a prefix of
          # `ubuntu-22.04-arm` (and `clang` of `clang_aot`), so a prefix
          # restore-key without it would pull another leg's cache.
          key: ccache-v2-${{ matrix.compiler }}-${{ matrix.platform.os }}-sha-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ matrix.compiler }}-${{ matrix.platform.os }}-sha-