name: Build Mesen

# LINUX ONLY (ADR-0191, 2026-09-14). The user's policy, that day, in two
# sentences: every *binary* build is macOS Apple Silicon only for now, and CI
# compiles Linux only while the macOS build is made locally when it is needed.
# The two Windows publish jobs and the four macOS legs were therefore DELETED
# from this file - they are not commented out, not `if: false`. The revision
# history is where they live: `git log -p -- .github/workflows/build.yml`, or
# `git show 109c1a6f:.github/workflows/build.yml` for the last 14-job version.
# What is left is the six-leg Linux matrix and the two AppImage legs, and
# neither needed an artifact from a removed job.
#
# The macOS release is built LOCALLY by `make release-macos` (Phase 11 C.4),
# which injects the fresh `MesenCore.dylib` into the bundle, codesigns ad hoc
# and fails on a hash mismatch. There is no macOS runner in this repository to
# compare it against, by decision.
#
# Windows is retired from CI until the user lifts the rule. Restoring either
# platform is a revert of the commit that landed ADR-0191, plus a line in that
# ADR saying why.

on:
  # TEMPORARY (2026-09-14): `push` and `pull_request` were REMOVED, so the
  # matrix below runs only when someone dispatches it:
  #   gh workflow run build.yml --repo sbihaiko/MesenAI --ref <branch>
  #
  # The reason is the same one that suspended the `pull_request` trigger on
  # 2026-09-13: the matrix was 14 jobs (two Windows publish profiles, six
  # Linux/AppImage compiler×arch legs, four macOS legs with a codesign step),
  # each a full LTO/AOT build, and a branch that lands three commits in an
  # afternoon queues more runner time than the work in the commits. ADR-0191
  # then cut it to the eight Linux legs below; the trigger stays
  # `workflow_dispatch` regardless.
  #
  # The always-on gate did NOT go away with the triggers — it moved to
  # `checks.yml`, which runs on every push and pull request. It had to move to
  # another file rather than becoming a job here, for two reasons that are both
  # about this file's identity:
  #   1. nightly.link resolves the README's download links against the NEWEST
  #      run of THIS workflow on `main`. A push to `main` that ran an
  #      artifact-less job here would become that newest run and the links would
  #      stop serving the binaries until the next dispatch.
  #   2. `cancel-in-progress` below is keyed on the workflow and the ref. A push
  #      to `main` while a dispatched build was running would cancel the only
  #      artifact-producing run for that ref.
  # With the triggers gone, every run of this file is a build, so neither can
  # happen.
  #
  # TO RESTORE THE BINARY BUILDS: put the `push`/`pull_request` blocks back
  # under `on:` (and, if `checks.yml` is no longer wanted, delete that file).
  # No job below is aware of the gate — there is no `if:` to remove.
  workflow_dispatch:

# Every job used to carry
#   if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
# to avoid building one commit twice. That guard assumes `push` fires for the
# branch a pull request comes from — true upstream, where contributors push
# branches to the repo itself, and false here: `push` was restricted to `main`,
# and a pull request's head branch is never `main`. The two triggers therefore
# could not overlap, and the guard only had the effect of skipping every
# internal pull request — including each `sync/upstream/<date>` branch the
# upstream-sync workflow opens, which reached `main` never having been compiled
# (#178). Removed, and moot while the only trigger is `workflow_dispatch`. If
# `push` is ever restored, key any guard on the branch, not on the head
# repository.

# A second dispatch for the same ref cancels the first — no point finishing a
# build for a revision someone else is already superseding by hand. This cannot
# fire in response to a push any more, because a push does not trigger this
# workflow at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  linux:
    strategy:
      matrix:
        compiler: [gcc, clang, clang_aot]
        platform: [
          {os: ubuntu-22.04, path: x64},
          {os: ubuntu-22.04-arm, path: arm64}
        ]
        include:
          - compiler: gcc
            make_flags: "USE_GCC=true"
          - compiler: clang
            make_flags: ""
          - compiler: clang_aot
            make_flags: "USE_AOT=true"
      fail-fast: false
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev ccache # The compilers are already installed on GitHub's runners.
          python3 -m pip install --user PyYAML==6.0.3 Pillow==12.3.0 numpy==2.2.6 # numpy 2.3+ dropped Python 3.10 (ubuntu-22.04 runners) # doc-checks verify scripts need PyYAML/Pillow/numpy (not preinstalled everywhere)

      - name: Setup CCache
        uses: ./.github/actions/setup-ccache-action
       
      - name: Write commit SHA1 to file
        uses: ./.github/actions/build-sha1-action

      - name: Run doc checks
        run: make doc-checks

      # stderr is not detected as a TTY, so diagnostics are by default printed without colours;
      # forcing colours makes the log a little nicer to read.
      - name: Build Mesen
        run: |
          make -j$(nproc) -O ${{ matrix.make_flags }} LTO=true STATICLINK=true SYSTEM_LIBEVDEV=false

      - name: Upload Mesen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: Mesen (Linux - ${{ matrix.platform.os }} - ${{ matrix.compiler }})
          path: bin/linux-${{ matrix.platform.path }}/Release/linux-${{ matrix.platform.path }}/publish/Mesen

  appimage:
    strategy:
      matrix:
        compiler: [clang_appimage]
        platform: [
          {os: ubuntu-22.04, name: x64, script: Linux/appimage/appimage.sh},
          {os: ubuntu-22.04-arm, name: ARM64, script: Linux/appimage/appimage-arm64.sh}
        ]
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev libfuse2 ccache # The compilers are already installed on GitHub's runners.

      - name: Setup CCache
        uses: ./.github/actions/setup-ccache-action

      - name: Write commit SHA1 to file
        uses: ./.github/actions/build-sha1-action

      - name: Build Mesen (AppImage)
        run: |
          ${{ matrix.platform.script }}

      - name: Upload Mesen (AppImage)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: Mesen (Linux ${{ matrix.platform.name }} - AppImage)
          path: Mesen.AppImage
