name: Build Mesen

# LINUX + WINDOWS + macOS APPLE SILICON (ADR-0203, 2026-09-16, amending
# ADR-0191). ADR-0191 (2026-09-14) had cut this file to Linux only, deleting
# the two Windows publish jobs and all four macOS legs (2 compilers x 2
# architectures - Apple Silicon and Intel). ADR-0203 restores Windows and
# macOS, narrowed to what the published release actually is: Apple Silicon
# only, no `macos-15-intel` leg. The matrix is 10 jobs, not the original 14.
#
# The 14-job version, if a full restore is ever wanted, lives in history:
# `git show 109c1a6f:.github/workflows/build.yml`.
#
# The CI macOS leg is NOT code-signed. The deleted job signed with a
# Developer ID certificate from repository secrets, which is distribution
# signing and belongs to the release path, not to a CI compile check. The
# published macOS release is still built by `scripts/release_macos.sh`, which
# ad-hoc signs and verifies the bundle itself (Phase 11 C.4); this leg exists
# to prove the build compiles and to hand back a runnable artifact.
#
# ADR-0204 (2026-09-17) adds the `publish` job at the bottom: the four build
# jobs upload artifacts, and `publish` republishes them under fixed names as
# assets of a rolling pre-release, which is what the README's download links
# resolve against. Until then those links were nightly.link URLs, which can only
# ever resolve against a PUSH run - see the job's own comment.

on:
  # ADR-0191 (2026-09-14) cut this workflow down to a hand-run path and
  # removed both triggers it used to have. ADR-0200 (2026-09-16) restored ONE
  # of them, the narrow one: a pull request whose BASE branch is `prod`.
  #
  #   gh workflow run build.yml --repo sbihaiko/MesenAI --ref <branch>
  #
  # `pull_request.branches` filters on the BASE branch, so a pull request
  # opened AGAINST `prod` builds, and an ordinary one against `main` does not.
  # The default activity types (opened, synchronize, reopened) are kept, so a
  # push to the head branch of an open `prod` pull request rebuilds it.
  #
  # `push` stays gone, for the two reasons that are this file's identity:
  #   1. nightly.link resolves the README's download links against the NEWEST
  #      run of THIS workflow on `main`. A push to `main` that ran an
  #      artifact-less job here would become that newest run and the links would
  #      stop serving the binaries until the next dispatch.
  #   2. `cancel-in-progress` below is keyed on the workflow and the ref. A push
  #      to `main` while a dispatched build was running would cancel the only
  #      artifact-producing run for that ref.
  # A `pull_request` run executes at `refs/pull/N/merge` — neither `main` nor a
  # ref a dispatch uses — so it can do neither. That is what makes this trigger
  # safe where `push` is not.
  #
  # The always-on gate lives in `checks.yml`, not here, for those same two
  # reasons: it runs on every push and pull request, and an artifact-less job in
  # THIS file would supersede the run the download links resolve against.
  #
  # ADR-0203 (2026-09-16) restored the Windows and macOS jobs below without
  # touching this trigger set: two thirds of the matrix therefore only runs on
  # a `prod` pull request or a manual dispatch, not on every push to `main`.
  pull_request:
    branches:
      - 'prod'
  workflow_dispatch:

# Every job used to carry
#   if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
# to avoid building one commit twice. That guard assumes `push` fires for the
# branch a pull request comes from — true upstream, where contributors push
# branches to the repo itself, and false here: `push` was restricted to `main`,
# and a pull request's head branch is never `main`. The two triggers therefore
# could not overlap, and the guard only had the effect of skipping every
# internal pull request — including each `sync/upstream/<date>` branch the
# upstream-sync workflow opens, which reached `main` never having been compiled
# (#178). Removed, and never reintroduced: the trigger set is now a
# `prod`-filtered `pull_request` plus `workflow_dispatch`, which still cannot
# overlap. If `push` is ever restored, key any guard on the branch, not on the
# head repository.

# A second dispatch for the same ref cancels the first — no point finishing a
# build for a revision someone else is already superseding by hand. A push
# cannot trigger this workflow at all, so this only ever fires for the two
# remaining triggers, and a pull request groups on its own `refs/pull/N/merge`
# ref: concurrent `prod` pull requests never cancel each other, and none of
# them can cancel a dispatched build on `main`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  windows:
    strategy:
      matrix:
        platform: [
          {netversion: 10.x, targetframework: net10.0, aot: false, singleFile: true, aotString: ""},
          {netversion: 10.x, targetframework: net10.0, aot: true, singleFile: false, aotString: " - AoT"}
        ]
      fail-fast: false
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ matrix.platform.netversion }}

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          msbuild-architecture: x64

      - name: Restore packages
        run: dotnet restore -p:TargetFramework="${{ matrix.platform.targetframework }}" -r win-x64 -p:PublishAot="${{ matrix.platform.aot }}" -p:BuildWithNetFrameworkHostedCompiler=true

      - name: Write commit SHA1 to file
        uses: ./.github/actions/build-sha1-action

      # MSBuild compiles the native MesenCore.dll (the C++ interop project) via
      # the -t:UI target; `dotnet publish` below does not compile it and only
      # copies it into the publish output, so skipping this step fails publish
      # with "Could not copy the file ...MesenCore.dll because it was not
      # found" rather than a native compile error - caught the hard way on the
      # first ADR-0203 run.
      - name: Build Mesen
        run: msbuild -nologo -v:d -clp:ForceConsoleColor -m -p:Configuration=Release -p:Platform=x64 -t:Clean,UI -p:TargetFramework="${{ matrix.platform.targetframework }}" -p:OptimizeUi="true"

      - name: Publish Mesen
        run: dotnet publish --no-restore -c Release -p:PublishAot="${{ matrix.platform.aot }}" -p:SelfContained="${{ matrix.platform.aot }}" -p:PublishSingleFile="${{ matrix.platform.singleFile }}" -p:OptimizeUi="true" -p:Platform="Any CPU" -p:TargetFramework="${{ matrix.platform.targetframework }}" -r win-x64 Mesen.sln /p:PublishProfile=UI\Properties\PublishProfiles\Release.pubxml

      - name: Upload Mesen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mesen (Windows - ${{ matrix.platform.targetframework }}${{ matrix.platform.aotString }})
          path: |
            build/TmpReleaseBuild/Mesen.exe

  macos:
    strategy:
      matrix:
        compiler: [clang, clang_aot]
        # Apple Silicon only (ADR-0203): the published release is arm64 and
        # the README says "macOS Apple Silicon". The deleted job also carried
        # a macos-15-intel leg; it is not restored, because it would build an
        # artifact nothing links to.
        platform: [
          {os: macos-15, arch: arm64}
        ]
        include:
          - compiler: clang
            make_flags: ""
          - compiler: clang_aot
            make_flags: "USE_AOT=true"
      fail-fast: false
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: |
          brew install sdl2 ccache
          # Homebrew python is externally-managed (PEP 668): --break-system-packages is required.
          python3 -m pip install --user --break-system-packages PyYAML==6.0.3 Pillow==12.3.0 numpy==2.2.6 # numpy 2.3+ dropped Python 3.10 (ubuntu-22.04 runners)

      - name: Get brew prefix
        run: |
          echo "brewPrefix=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Setup CCache
        uses: ./.github/actions/setup-ccache-action
        with:
          ccache-path: '${{ env.brewPrefix }}/opt/ccache/libexec'

      - name: Write commit SHA1 to file
        uses: ./.github/actions/build-sha1-action

      - name: Run doc checks
        run: make doc-checks

      # stderr is not detected as a TTY, so diagnostics are by default printed without colours;
      # forcing colours makes the log a little nicer to read.
      - name: Build Mesen
        run: |
          ${{ matrix.make_flags }} make -j$(sysctl -n hw.logicalcpu)

      # No signing step: this leg is a compile check + a runnable artifact for
      # `workflow_dispatch`, not a distribution build. ADR-0203 §5 keeps
      # Developer ID signing out of CI; the published release is signed ad hoc
      # by scripts/release_macos.sh, run locally.
      - name: Zip Mesen.app
        run: |
          ditto -c -k --sequesterRsrc --keepParent bin/osx-${{ matrix.platform.arch }}/Release/osx-${{ matrix.platform.arch }}/publish/Mesen.app bin/osx-${{ matrix.platform.arch }}/Release/Mesen.app.zip

      - name: Upload Mesen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mesen (macOS - ${{ matrix.platform.os }} - ${{ matrix.compiler }})
          path: bin/osx-${{ matrix.platform.arch }}/Release/Mesen.app.zip

  linux:
    strategy:
      matrix:
        compiler: [gcc, clang, clang_aot]
        platform: [
          {os: ubuntu-22.04, path: x64},
          {os: ubuntu-22.04-arm, path: arm64}
        ]
        include:
          - compiler: gcc
            make_flags: "USE_GCC=true"
          - compiler: clang
            make_flags: ""
          - compiler: clang_aot
            make_flags: "USE_AOT=true"
      fail-fast: false
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev ccache # The compilers are already installed on GitHub's runners.
          python3 -m pip install --user PyYAML==6.0.3 Pillow==12.3.0 numpy==2.2.6 # numpy 2.3+ dropped Python 3.10 (ubuntu-22.04 runners) # doc-checks verify scripts need PyYAML/Pillow/numpy (not preinstalled everywhere)

      - name: Setup CCache
        uses: ./.github/actions/setup-ccache-action
       
      - name: Write commit SHA1 to file
        uses: ./.github/actions/build-sha1-action

      - name: Run doc checks
        run: make doc-checks

      # stderr is not detected as a TTY, so diagnostics are by default printed without colours;
      # forcing colours makes the log a little nicer to read.
      - name: Build Mesen
        run: |
          make -j$(nproc) -O ${{ matrix.make_flags }} LTO=true STATICLINK=true SYSTEM_LIBEVDEV=false

      - name: Upload Mesen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mesen (Linux - ${{ matrix.platform.os }} - ${{ matrix.compiler }})
          path: bin/linux-${{ matrix.platform.path }}/Release/linux-${{ matrix.platform.path }}/publish/Mesen

  appimage:
    strategy:
      matrix:
        compiler: [clang_appimage]
        platform: [
          {os: ubuntu-22.04, name: x64, script: Linux/appimage/appimage.sh},
          {os: ubuntu-22.04-arm, name: ARM64, script: Linux/appimage/appimage-arm64.sh}
        ]
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev libfuse2 ccache # The compilers are already installed on GitHub's runners.

      - name: Setup CCache
        uses: ./.github/actions/setup-ccache-action

      - name: Write commit SHA1 to file
        uses: ./.github/actions/build-sha1-action

      - name: Build Mesen (AppImage)
        run: |
          ${{ matrix.platform.script }}

      - name: Upload Mesen (AppImage)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mesen (Linux ${{ matrix.platform.name }} - AppImage)
          path: Mesen.AppImage

  # ADR-0204: the README's download links point at fixed-name assets of one
  # rolling pre-release, not at nightly.link. nightly.link resolves a branch
  # against a PUSH run and nothing else - its 404 says so outright,
  # `?query=event%3Apush+is%3Asuccess+branch%3Aprod` - and this workflow has had
  # no push trigger since ADR-0191, so every URL ADR-0203 §6 put in the README
  # was a guaranteed 404 no matter how many times it was dispatched.
  #
  # `pull_request` is excluded on purpose: a pull request run executes at
  # `refs/pull/N/merge`, a merge preview of code that has not landed. This is
  # the one place in this file where the event guard belongs - the build jobs'
  # uploads must never carry it, which is what §5 of
  # `verify_ci_platform_matrix.sh` asserts.
  publish:
    needs: [windows, macos, linux, appimage]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download this run's artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # The artifact names carry the matrix coordinates and may change; the
      # asset names below are the README's URLs and must not. Keeping the
      # translation in one step is what makes that separation checkable.
      - name: Stage the assets under their fixed names
        run: |
          set -euo pipefail
          mkdir -p out
          zip -j out/MesenAI-ci-linux-x64.zip       "artifacts/Mesen (Linux - ubuntu-22.04 - clang_aot)/Mesen"
          zip -j out/MesenAI-ci-linux-arm64.zip     "artifacts/Mesen (Linux - ubuntu-22.04-arm - clang_aot)/Mesen"
          zip -j out/MesenAI-ci-windows-x64-aot.zip "artifacts/Mesen (Windows - net10.0 - AoT)/Mesen.exe"
          cp "artifacts/Mesen (Linux x64 - AppImage)/Mesen.AppImage"     out/MesenAI-ci-linux-x64.AppImage
          cp "artifacts/Mesen (Linux ARM64 - AppImage)/Mesen.AppImage"   out/MesenAI-ci-linux-arm64.AppImage
          cp "artifacts/Mesen (macOS - macos-15 - clang_aot)/Mesen.app.zip" out/MesenAI-ci-macos-arm64.zip
          ls -l out

      - name: Publish to the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=ci-latest
          # --prerelease is load-bearing: it keeps `releases/latest` - the
          # badge, the README's release link, `gh release view` with no tag -
          # resolving to the real release instead of to a CI build.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "CI builds (not a release)" \
              --notes "Rolling build of the \`prod\` branch, replaced on every publish (ADR-0204). Not a release: the tagged release is macOS Apple Silicon only. Unzip and run; see the README's Download section for each platform's prerequisite."
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
