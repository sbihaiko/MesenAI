name: Build Mesen

on:
  # TEMPORARY (2026-09-14): `push` and `pull_request` were REMOVED, so the
  # matrix below runs only when someone dispatches it:
  #   gh workflow run build.yml --repo sbihaiko/MesenCE --ref <branch>
  #
  # The reason is the same one that suspended the `pull_request` trigger on
  # 2026-09-13: the matrix is 14 jobs (two Windows publish profiles, six
  # Linux/AppImage compiler×arch legs, four macOS legs with a codesign step),
  # each a full LTO/AOT build, and a branch that lands three commits in an
  # afternoon queues more runner time than the work in the commits.
  #
  # The always-on gate did NOT go away with the triggers — it moved to
  # `checks.yml`, which runs on every push and pull request. It had to move to
  # another file rather than becoming a job here, for two reasons that are both
  # about this file's identity:
  #   1. nightly.link resolves the README's download links against the NEWEST
  #      run of THIS workflow on `main`. A push to `main` that ran an
  #      artifact-less job here would become that newest run and the links would
  #      stop serving the binaries until the next dispatch.
  #   2. `cancel-in-progress` below is keyed on the workflow and the ref. A push
  #      to `main` while a dispatched build was running would cancel the only
  #      artifact-producing run for that ref.
  # With the triggers gone, every run of this file is a build, so neither can
  # happen.
  #
  # TO RESTORE THE BINARY BUILDS: put the `push`/`pull_request` blocks back
  # under `on:` (and, if `checks.yml` is no longer wanted, delete that file).
  # No job below is aware of the gate — there is no `if:` to remove.
  #
  # `version` names what a run produces. It deliberately names the *files*
  # inside the artifacts and the two tools artifacts — never the emulator
  # artifact names themselves, for reason 1 above: nightly.link resolves the
  # README's download links against the newest run of this workflow on `main`
  # *by artifact name*, so a release dispatch that renamed `Mesen (macOS -
  # macos-15 - clang_aot)` would 404 every link in the README until someone
  # dispatched an unversioned run. The tools artifacts are new names, so they
  # cost the links nothing.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version that names the release files, e.g. v0.1.0 (leave as `dev` for a plain build)'
        required: false
        default: dev
        type: string

# Every job used to carry
#   if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
# to avoid building one commit twice. That guard assumes `push` fires for the
# branch a pull request comes from — true upstream, where contributors push
# branches to the repo itself, and false here: `push` was restricted to `main`,
# and a pull request's head branch is never `main`. The two triggers therefore
# could not overlap, and the guard only had the effect of skipping every
# internal pull request — including each `sync/upstream/<date>` branch the
# upstream-sync workflow opens, which reached `main` never having been compiled
# (#178). Removed, and moot while the only trigger is `workflow_dispatch`. If
# `push` is ever restored, key any guard on the branch, not on the head
# repository.

# A second dispatch for the same ref cancels the first — no point finishing a
# build for a revision someone else is already superseding by hand. This cannot
# fire in response to a push any more, because a push does not trigger this
# workflow at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # `inputs.version` is only defined for a `workflow_dispatch`; the fallback
  # keeps the expression valid if a trigger is ever restored (see the top).
  MESENCE_VERSION: ${{ inputs.version || 'dev' }}

jobs:
  windows:
    strategy:
      matrix:
        platform: [
          {netversion: 10.x, targetframework: net10.0, aot: false, singleFile: true, aotString: ""},
          {netversion: 10.x, targetframework: net10.0, aot: true, singleFile: false, aotString: " - AoT"}
        ]
      fail-fast: false
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ matrix.platform.netversion }}

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          msbuild-architecture: x64

      - name: Restore packages
        run: dotnet restore -p:TargetFramework="${{ matrix.platform.targetframework }}" -r win-x64 -p:PublishAot="${{ matrix.platform.aot }}" -p:BuildWithNetFrameworkHostedCompiler=true

      - name: Write commit SHA1 to file
        uses: ./.github/actions/build-sha1-action

      - name: Build Mesen
        run: msbuild -nologo -v:d -clp:ForceConsoleColor -m -p:Configuration=Release -p:Platform=x64 -t:Clean,UI -p:TargetFramework="${{ matrix.platform.targetframework }}" -p:OptimizeUi="true"

      - name: Publish Mesen
        run: dotnet publish --no-restore -c Release -p:PublishAot="${{ matrix.platform.aot }}" -p:SelfContained="${{ matrix.platform.aot }}" -p:PublishSingleFile="${{ matrix.platform.singleFile }}" -p:OptimizeUi="true" -p:Platform="Any CPU" -p:TargetFramework="${{ matrix.platform.targetframework }}" -r win-x64 Mesen.sln /p:PublishProfile=UI\Properties\PublishProfiles\Release.pubxml

      - name: Upload Mesen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: Mesen (Windows - ${{ matrix.platform.targetframework }}${{ matrix.platform.aotString }})
          path: |
            build/TmpReleaseBuild/Mesen.exe


  linux:
    strategy:
      matrix:
        compiler: [gcc, clang, clang_aot]
        platform: [
          {os: ubuntu-22.04, path: x64},
          {os: ubuntu-22.04-arm, path: arm64}
        ]
        include:
          - compiler: gcc
            make_flags: "USE_GCC=true"
          - compiler: clang
            make_flags: ""
          - compiler: clang_aot
            make_flags: "USE_AOT=true"
      fail-fast: false
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev ccache # The compilers are already installed on GitHub's runners.
          python3 -m pip install --user PyYAML==6.0.3 Pillow==12.3.0 numpy==2.2.6 # numpy 2.3+ dropped Python 3.10 (ubuntu-22.04 runners) # doc-checks verify scripts need PyYAML/Pillow/numpy (not preinstalled everywhere)

      - name: Setup CCache
        uses: ./.github/actions/setup-ccache-action
       
      - name: Write commit SHA1 to file
        uses: ./.github/actions/build-sha1-action

      - name: Run doc checks
        run: make doc-checks

      # stderr is not detected as a TTY, so diagnostics are by default printed without colours;
      # forcing colours makes the log a little nicer to read.
      - name: Build Mesen
        run: |
          make -j$(nproc) -O ${{ matrix.make_flags }} LTO=true STATICLINK=true SYSTEM_LIBEVDEV=false

      - name: Upload Mesen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: Mesen (Linux - ${{ matrix.platform.os }} - ${{ matrix.compiler }})
          path: bin/linux-${{ matrix.platform.path }}/Release/linux-${{ matrix.platform.path }}/publish/Mesen

      # Stage 1 of docs/remastering-a-game.md is `scripts/headless_record`, a
      # compiled tool. A release that ships the Python half of the guide and
      # not this one stops the reader at the first command, so build it here.
      # One leg per architecture is enough — the tool is the same code under
      # every compiler flavour, and `clang` is the plain one.
      - name: Build headless_record (capture tool)
        if: matrix.compiler == 'clang'
        run: make capture-tool

      # The Makefile links the tool for use *from a checkout*: it names the
      # core library by the relative path it was linked against, which only
      # resolves when the tool is run from the repository root. A downloaded
      # zip has no repository root, so re-point the DT_NEEDED entry at a bare
      # name and give the binary an $ORIGIN rpath — then the tool and the
      # library travel together in one folder.
      - name: Stage the native tools
        if: matrix.compiler == 'clang'
        run: |
          set -euo pipefail
          sudo apt-get install -qy patchelf
          OUT="mesence-tools-native-${MESENCE_VERSION}-linux-${{ matrix.platform.path }}"
          mkdir -p "$OUT/scripts"
          cp scripts/headless_record "$OUT/scripts/headless_record"
          cp "InteropDLL/obj.linux-${{ matrix.platform.path }}/MesenCore.so" "$OUT/scripts/MesenCore.so"
          NEEDED=$(patchelf --print-needed "$OUT/scripts/headless_record" | grep 'MesenCore\.so$')
          echo "linked against: $NEEDED"
          if [ "$NEEDED" != "MesenCore.so" ]; then
            patchelf --replace-needed "$NEEDED" MesenCore.so "$OUT/scripts/headless_record"
          fi
          patchelf --set-rpath '$ORIGIN' "$OUT/scripts/headless_record"
          # A check, not a hope: if the relocation did not take, the tool would
          # fail on a user's machine with a link error nobody can diagnose.
          ldd "$OUT/scripts/headless_record"
          if ldd "$OUT/scripts/headless_record" | grep -q 'not found'; then
            echo "error: headless_record has unresolved libraries after relocation" >&2
            exit 1
          fi
          cp docs/releases/native-tools-README.md "$OUT/README.md"
          echo "$MESENCE_VERSION" > "$OUT/VERSION"
          zip -q -r "$OUT.zip" "$OUT"

      - name: Upload the native tools
        if: matrix.compiler == 'clang'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MesenCE tools native (${{ env.MESENCE_VERSION }} - linux-${{ matrix.platform.path }})
          path: mesence-tools-native-${{ env.MESENCE_VERSION }}-linux-${{ matrix.platform.path }}.zip

  appimage:
    strategy:
      matrix:
        compiler: [clang_appimage]
        platform: [
          {os: ubuntu-22.04, name: x64, script: Linux/appimage/appimage.sh},
          {os: ubuntu-22.04-arm, name: ARM64, script: Linux/appimage/appimage-arm64.sh}
        ]
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev libfuse2 ccache # The compilers are already installed on GitHub's runners.

      - name: Setup CCache
        uses: ./.github/actions/setup-ccache-action

      - name: Write commit SHA1 to file
        uses: ./.github/actions/build-sha1-action

      - name: Build Mesen (AppImage)
        run: |
          ${{ matrix.platform.script }}

      - name: Upload Mesen (AppImage)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: Mesen (Linux ${{ matrix.platform.name }} - AppImage)
          path: Mesen.AppImage


  macos:
    strategy:
      matrix:
        compiler: [clang, clang_aot]
        platform: [
          {os: macos-15-intel, arch: x64},
          {os: macos-15, arch: arm64}
        ]
        include:
          - compiler: clang
            make_flags: ""
          - compiler: clang_aot
            make_flags: "USE_AOT=true"
      fail-fast: false
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Install dependencies
        run: |
          brew install sdl2 ccache
          # Homebrew python is externally-managed (PEP 668): --break-system-packages is required.
          python3 -m pip install --user --break-system-packages PyYAML==6.0.3 Pillow==12.3.0 numpy==2.2.6 # numpy 2.3+ dropped Python 3.10 (ubuntu-22.04 runners)

      - name: Get brew prefix
        run: |
          echo "brewPrefix=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Setup CCache
        uses: ./.github/actions/setup-ccache-action
        with:
          ccache-path: '${{ env.brewPrefix }}/opt/ccache/libexec'

      - name: Write commit SHA1 to file
        uses: ./.github/actions/build-sha1-action

      - name: Run doc checks
        run: make doc-checks

      # stderr is not detected as a TTY, so diagnostics are by default printed without colours;
      # forcing colours makes the log a little nicer to read.
      - name: Build Mesen
        run: |
          ${{ matrix.make_flags }} make -j$(sysctl -n hw.logicalcpu)

      # The known trap: `dotnet publish -t:BundleApp` copies MesenCore.dylib
      # into the bundle as part of the C# build, and skips that copy when the
      # C# build is already up to date. Locally that ships a .app carrying an
      # old core (scripts/build_app_macos.sh exists to work around it). CI is
      # believed to be immune because it builds from a clean tree — but
      # "believed" is not a property a release can rest on, so: copy the freshly
      # built dylib in, then compare hashes and fail the job if they differ.
      #
      # This runs *before* the signing step on purpose: overwriting a file
      # inside a signed bundle invalidates the signature.
      - name: Put the freshly built MesenCore.dylib in the .app (and check it)
        run: |
          set -euo pipefail
          APP="bin/osx-${{ matrix.platform.arch }}/Release/osx-${{ matrix.platform.arch }}/publish/Mesen.app"
          BUILT="InteropDLL/obj.osx-${{ matrix.platform.arch }}/MesenCore.dylib"
          INSIDE="$APP/Contents/MacOS/MesenCore.dylib"

          test -f "$BUILT"  || { echo "error: no freshly built dylib at $BUILT" >&2; exit 1; }
          # If this is missing, BundleApp's layout changed and a plain `cp`
          # would drop a stray file while the real one stayed stale.
          test -f "$INSIDE" || { echo "error: no dylib at $INSIDE — bundle layout changed" >&2; exit 1; }

          BEFORE=$(shasum -a 256 "$INSIDE" | cut -d' ' -f1)
          BUILT_SUM=$(shasum -a 256 "$BUILT" | cut -d' ' -f1)
          if [ "$BEFORE" = "$BUILT_SUM" ]; then
            echo "bundle already carried the freshly built dylib ($BUILT_SUM)"
          else
            echo "::warning::the bundled dylib was stale ($BEFORE) — injecting the built one ($BUILT_SUM)"
          fi

          cp -f "$BUILT" "$INSIDE"

          cmp "$BUILT" "$INSIDE"
          AFTER=$(shasum -a 256 "$INSIDE" | cut -d' ' -f1)
          if [ "$AFTER" != "$BUILT_SUM" ]; then
            echo "error: the dylib inside the .app ($AFTER) is not the built one ($BUILT_SUM)" >&2
            exit 1
          fi
          echo "ok: $INSIDE == $BUILT ($BUILT_SUM)"

      # Same reason as the Linux job: stage 1 of docs/remastering-a-game.md is
      # a compiled tool, and a release without it stops the reader at the first
      # command. One leg per architecture; `clang` is the plain one.
      - name: Build headless_record (capture tool)
        if: matrix.compiler == 'clang'
        run: make capture-tool

      # The Makefile points the tool at an absolute $(CURDIR) path inside the
      # runner's workspace, which exists on no other machine. Re-point it at
      # @executable_path and ship the library beside the binary.
      - name: Stage the native tools
        if: matrix.compiler == 'clang'
        run: |
          set -euo pipefail
          ARCH="${{ matrix.platform.arch }}"
          OUT="mesence-tools-native-${MESENCE_VERSION}-macos-${ARCH}"
          mkdir -p "$OUT/scripts"
          cp scripts/headless_record "$OUT/scripts/headless_record"
          cp "InteropDLL/obj.osx-${ARCH}/MesenCore.dylib" "$OUT/scripts/MesenCore.dylib"

          CURRENT=$(otool -L "$OUT/scripts/headless_record" | awk '/MesenCore\.dylib/{print $1}')
          echo "linked against: $CURRENT"
          install_name_tool -change "$CURRENT" "@executable_path/MesenCore.dylib" "$OUT/scripts/headless_record"
          codesign -f -s - "$OUT/scripts/headless_record"
          codesign -f -s - "$OUT/scripts/MesenCore.dylib"

          # A check, not a hope: any absolute path left pointing into the
          # runner's workspace would be a tool that only runs on the runner.
          otool -L "$OUT/scripts/headless_record"
          if otool -L "$OUT/scripts/headless_record" | grep -q "$PWD"; then
            echo "error: headless_record still references the build workspace" >&2
            exit 1
          fi

          cp docs/releases/native-tools-README.md "$OUT/README.md"
          echo "$MESENCE_VERSION" > "$OUT/VERSION"
          ditto -c -k --sequesterRsrc --keepParent "$OUT" "$OUT.zip"

      - name: Upload the native tools
        if: matrix.compiler == 'clang'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MesenCE tools native (${{ env.MESENCE_VERSION }} - macos-${{ matrix.platform.arch }})
          path: mesence-tools-native-${{ env.MESENCE_VERSION }}-macos-${{ matrix.platform.arch }}.zip

      - name: Sign binary
        if: github.event_name != 'pull_request'
        env:
          APP_NAME: bin/osx-${{ matrix.platform.arch }}/Release/osx-${{ matrix.platform.arch }}/publish/Mesen.app
          CERT_DATA: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASS: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          ENTITLEMENTS: UI/Mesen.entitlements
          SIGNING_IDENTITY: Mesen
        run: |
          # Export certs
          echo "$CERT_DATA" | base64 --decode > /tmp/certs.p12
          # Create keychain
          security create-keychain -p actions macos-build.keychain
          security default-keychain -s macos-build.keychain
          security unlock-keychain -p actions macos-build.keychain
          security set-keychain-settings -t 3600 -u macos-build.keychain
          # Import certs to keychain
          security import /tmp/certs.p12 -k ~/Library/Keychains/macos-build.keychain -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/productsign
          # Key signing
          security set-key-partition-list -S apple-tool:,apple: -s -k actions macos-build.keychain
          # print identities
          security find-identity -v macos-build.keychain

          echo "[INFO] Signing app file"
          codesign --force --deep --timestamp --keychain macos-build.keychain --options=runtime --entitlements "$ENTITLEMENTS" --sign "$SIGNING_IDENTITY" "$APP_NAME"

      - name: Zip Mesen.app
        if: github.event_name != 'pull_request'
        run: |
          ditto -c -k --sequesterRsrc --keepParent bin/osx-${{ matrix.platform.arch }}/Release/osx-${{ matrix.platform.arch }}/publish/Mesen.app bin/osx-${{ matrix.platform.arch }}/Release/Mesen.app.zip

      - name: Upload Mesen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: Mesen (macOS - ${{ matrix.platform.os }} - ${{ matrix.compiler }})
          path: bin/osx-${{ matrix.platform.arch }}/Release/Mesen.app.zip


  # ---------------------------------------------------------------------------
  # The tools a release ships beside the emulator.
  #
  # `docs/remastering-a-game.md` is the guide a pack author follows, and every
  # stage of it runs a tool from `scripts/`. Someone who downloads a binary
  # instead of cloning the repository has none of them, so a release carries a
  # `mesence-tools-<version>.zip`: the Python tools the guide names, their
  # transitive local imports, the shipped `scripts/stages/` routes, the three
  # guides themselves, and a `requirements.txt`.
  #
  # The file list is explicit rather than `scripts/*.py` on purpose: `scripts/`
  # also holds 36 test files, the community-pack CI helpers and maintainer-only
  # scripts that need the `gh` CLI, none of which belong in a player's download.
  # It lives in `scripts/tools-zip-manifest.txt` and was computed as the
  # transitive import closure of the tools `remastering-a-game.md` and
  # `hd-pack-authoring.md` name; `scripts/check_tools_zip_closure.py` recomputes
  # the closure and fails this job when the manifest disagrees, so a new import
  # cannot silently ship a zip that dies on `ModuleNotFoundError`.
  #
  # Pillow and numpy are the only non-stdlib imports in that closure; the pins
  # match the ones the Linux and macOS jobs above install.
  tools:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify the manifest still matches the import closure
        run: python3 scripts/check_tools_zip_closure.py

      - name: Assemble the tools tree
        run: |
          set -euo pipefail
          ROOT="mesence-tools-${MESENCE_VERSION}"
          mkdir -p "$ROOT/scripts" "$ROOT/docs"

          while read -r f; do
            case "$f" in ''|'#'*) continue ;; esac
            cp "scripts/$f" "$ROOT/scripts/$f"
          done < scripts/tools-zip-manifest.txt

          cp -R scripts/stages "$ROOT/scripts/stages"
          cp scripts/record_stages.sh "$ROOT/scripts/record_stages.sh"
          chmod +x "$ROOT/scripts/record_stages.sh"

          cp docs/remastering-a-game.md docs/hd-pack-authoring.md \
             docs/enhancement-ecosystem.md "$ROOT/docs/"

          printf 'Pillow==12.3.0\nnumpy==2.2.6\n' > "$ROOT/requirements.txt"
          cp docs/releases/tools-zip-README.md "$ROOT/README.md"
          echo "$MESENCE_VERSION" > "$ROOT/VERSION"

      - name: Byte-compile every tool in the zip
        # A tool that does not compile is a tool nobody can run; the cheapest
        # gate that catches a truncated or mis-copied file.
        run: python3 -m compileall -q "mesence-tools-${MESENCE_VERSION}/scripts"

      - name: Zip the tools
        run: |
          set -euo pipefail
          find "mesence-tools-${MESENCE_VERSION}" -name __pycache__ -type d -exec rm -rf {} +
          zip -q -r "mesence-tools-${MESENCE_VERSION}.zip" "mesence-tools-${MESENCE_VERSION}"
          unzip -l "mesence-tools-${MESENCE_VERSION}.zip"

      - name: Upload the tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MesenCE tools (${{ env.MESENCE_VERSION }})
          path: mesence-tools-${{ env.MESENCE_VERSION }}.zip
