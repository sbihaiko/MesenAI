name: Community pack catalog

# Regenerates docs/community-packs.md and docs/community-packs.json from
# the "MesenCE Community Packs" board (Project 3, owner sbihaiko, node id
# PVT_kwHOB1MsbM4BhjpN).
#
# Trigger: workflow_dispatch only in this file. community-pack-validate.yml
# also triggers this workflow (via `gh workflow run community-pack-catalog.yml`)
# when the final verdict is one of the two "Aceito*" (accepted) states — that
# call lives in the reusable workflow's file, not here.
#
# `gh project item-list` (used by scripts/generate_community_pack_catalog.py)
# requires Projects v2 read; the default GITHUB_TOKEN can't see Projects v2 in
# a personal repo, so the generate step needs a classic PAT with `repo` +
# `project` + `read:org` scopes (`read:org` is also required by `gh project`
# commands to resolve the owner type even for a personal project — confirmed
# live via an "unknown owner type" failure without it) configured manually as
# a repo secret (exact name: `PROJECT_PAT`).
# This secret is not created by this workflow nor by any automation.
#
# Landing: `main` requires a pull request (ruleset). This job therefore pushes
# a dedicated branch and opens/updates a PR; it never pushes to `main`
# directly (run 34953429060 failed on GH013 for that reason).
on:
  workflow_dispatch:
  # Safety net for the two cases the per-verdict dispatch above cannot
  # cover: a dispatched run that died and a board Status changed BY HAND,
  # which no workflow observes — the ADR-0148 de-listings of 2026-08-31 were
  # hand moves. Regeneration reads the live board and is idempotent, so a
  # run with nothing to do opens no PR. Offset from the drift check's
  # '17 4 * * *' so the two never start together.
  schedule:
    - cron: '47 4 * * *'

# Every "Aceito*" verdict dispatches this workflow, so revalidating several
# packs at once used to start one run per pack. Serialize them; regeneration
# reads the live board and is idempotent, so a queued run that GitHub drops
# in favour of a newer one loses nothing.
concurrency:
  group: community-pack-catalog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-catalog:
    runs-on: ubuntu-latest
    env:
      # Board reads need PROJECT_PAT, and so does opening the PR (GITHUB_TOKEN
      # cannot — see the `gh pr create` call below). git push and the
      # pr view/close/merge calls still use GITHUB_TOKEN.
      PROJECT_PAT: ${{ secrets.PROJECT_PAT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate community-packs.md and community-packs.json
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: python3 scripts/generate_community_pack_catalog.py

      - name: Open or update catalog PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=chore/community-pack-catalog

          stage_catalog() {
            git add -- docs/community-packs.md
            if [ -f docs/community-packs.json ]; then
              git add -- docs/community-packs.json
            fi
          }

          regenerate() {
            GH_TOKEN="$PROJECT_PAT" python3 scripts/generate_community_pack_catalog.py
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          stage_catalog
          if git diff --cached --quiet; then
            echo "docs/community-packs.md and docs/community-packs.json unchanged, nothing to commit."
            if gh pr view "$BRANCH" --json number -q .number >/dev/null 2>&1; then
              echo "closing stale catalog PR (no diff against main after regeneration)."
              gh pr close "$BRANCH" --comment "Catalog regeneration produced no diff against main; closing." || true
            fi
            exit 0
          fi

          # Dedicated branch — never push to main (ruleset requires a PR).
          git fetch origin main
          git checkout -B "$BRANCH"
          # checkout -B keeps the index; re-stage in case the switch cleared it.
          stage_catalog
          git commit -m "chore: regenerate docs/community-packs.md and docs/community-packs.json"

          # Force-with-lease: this branch is owned by this workflow alone
          # (concurrency group above). A rejected lease means another run
          # just updated the tip; regenerate once more on the new main.
          if ! git push -u origin "HEAD:refs/heads/$BRANCH" --force-with-lease; then
            echo "force-with-lease rejected — regenerating on the latest main tip"
            git fetch origin main
            git reset --hard origin/main
            regenerate
            stage_catalog
            if git diff --cached --quiet; then
              echo "the newer main already carries this regeneration, nothing to commit."
              exit 0
            fi
            git commit -m "chore: regenerate docs/community-packs.md and docs/community-packs.json"
            git push -u origin "HEAD:refs/heads/$BRANCH" --force
          fi

          if gh pr view "$BRANCH" --json number -q .number >/dev/null 2>&1; then
            echo "catalog PR already open for $BRANCH"
          else
            # GITHUB_TOKEN cannot open the PR: this repository keeps "Allow
            # GitHub Actions to create and approve pull requests" off
            # (can_approve_pull_request_reviews: false), so the API answers
            # `GitHub Actions is not permitted to create or approve pull
            # requests`. PROJECT_PAT is the same secret the board read above
            # and sync-upstream.yml's `gh pr create` use. Without it every run
            # since the "main gate" ruleset landed (2026-09-14) failed here,
            # after the branch and its commit had already been pushed.
            if [ -z "${PROJECT_PAT:-}" ]; then
              echo "::error::PROJECT_PAT is unset — branch $BRANCH is pushed, but the PR must be opened by hand: https://github.com/$GITHUB_REPOSITORY/pull/new/$BRANCH"
              exit 1
            fi
            GH_TOKEN="$PROJECT_PAT" gh pr create --base main --head "$BRANCH" \
              --title "chore: regenerate community pack catalog" \
              --body "Automated regeneration of \`docs/community-packs.md\` and \`docs/community-packs.json\` from the Community Packs board (Project 3). Triggered by schedule or an accepted-pack verdict."
          fi
          # Queue merge once the required status checks pass (ruleset).
          gh pr merge "$BRANCH" --auto --squash || true
