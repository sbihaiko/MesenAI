# .github/workflows/community-pack-drift-check.yml
#
# Daily drift check for community packs already accepted in Project 3
# ("MesenCE Community Packs", node id PVT_kwHOB1MsbM4BhjpN, owner sbihaiko).
# For each accepted item, re-downloads the stored `pack_url` through
# `scripts/fetch_pack.py` (same host allow-list and SSRF guard as the validate
# workflow) and recomputes the hash with `sha256sum` (without calling the
# Claude Code Action in this pre-check); only when the hash changed does this workflow comment on
# the issue and call the reusable `community-pack-validate.yml` workflow with
# `mode: revalidate`.
#
# The default Actions `GITHUB_TOKEN` does NOT have read/write permission on
# Projects v2 in a personal account — this workflow needs a classic PAT with
# `repo` + `project` + `read:org` scopes (`read:org` is also required by
# `gh project` commands to resolve the owner type even for a personal
# project — confirmed live via an "unknown owner type" failure without it)
# supplied manually in the repository secret `PROJECT_PAT` (same requirement
# documented in `community-pack-validate.yml`; this workflow does not create
# that secret, it only consumes it).
#
# --- gh project provenance (see AC-5) ---------------------------------------
# CONFIRMED live, primary source, in this run's Scout session
# (`gh project field-list 3 --owner sbihaiko --format json`):
#   - Status field:    PVTSSF_lAHOB1MsbM4BhjpNzhge86c
#     options: 5173b5cd (Novo envio), 51951f52 (Em validação),
#              227e4623 (Inválido), 39e4f3a1 (Aceito parcial HD Mesen),
#              cd763737 (Aceito MEP completo)
#   - Pack Hash field: PVTF_lAHOB1MsbM4BhjpNzhge9Is
#
# Per-item JSON shape (confirmed live 2026-10-02 via `gh project item-list
# 3 --owner sbihaiko --format json`): `.status` is a plain string,
# `.content.number` is the issue number, and a field is keyed by its name
# with the first letter lowercased ("Pack Hash" -> "pack Hash"). This
# workflow never spells those keys: the listing goes through
# `scripts/pack_board_fields.py normalize`, the one lookup every board reader
# shares (bug #685: this step used to read the hash under the display name,
# matched no item and skipped the whole board). The parsing below stays
# defensive (`//` fallbacks, never direct indexing) so a missing value
# becomes a skipped item with a warning, not a crash.
# -----------------------------------------------------------------------------

name: Community Pack Drift Check

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: all Project/issue access uses the
# PROJECT_PAT secret (scoped to the steps that call `gh`), and the reusable
# workflow this calls declares only `contents: read` itself.
permissions:
  contents: read

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    outputs:
      mismatched: ${{ steps.diff.outputs.mismatched }}
    env:
      REPO: sbihaiko/MesenAI
      STATUS_ACCEPTED_PARTIAL: "Aceito parcial (HD Mesen)"
      STATUS_ACCEPTED_FULL: "Aceito (MEP completo)"
      STATUS_INVALID: "Inválido"
      MAX_PACK_BYTES: 314572800 # 300MB, same cap as community-pack-validate.yml
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: List accepted project items
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          set -euo pipefail
          # Bug #670: gh lists 30 items unless told otherwise. Ask for the
          # shared limit and stop the job when the listing may be truncated,
          # rather than reconcile/drift-check only part of the board.
          LIMIT=$(python3 scripts/gh_project_items.py limit)
          gh project item-list 3 --owner sbihaiko --limit "$LIMIT" --format json > items.json
          python3 scripts/gh_project_items.py check items.json
          python3 scripts/pack_board_fields.py normalize items.json > board.json

      # `pack:valid` and `pack:invalid` are mutually exclusive. Every verdict
      # path in community-pack-validate.yml already enforces that (the three
      # early rejections and `apply-verdict` all do
      # `--add-label <verdict> --remove-label <stale>`, #159), so the
      # pipeline's own moves are consistent. What nothing observed until now
      # is a Status moved BY HAND: the ADR-0148 de-listing of 2026-08-31
      # pushed #128-#131 and #133-#136 into "Inválido" without touching their
      # labels, leaving 8 issues carrying `pack:valid` in the invalid column
      # and zero `pack:invalid` anywhere on the board.
      #
      # The board Status is the source of truth for the verdict, so reconcile
      # the labels from it once a day. Adding a label that is already there,
      # or removing one that is not, is a no-op, and an item still in "Novo
      # envio"/"Em validação" carries no verdict yet and is skipped. This step
      # never moves an item and never comments — it only mirrors a decision
      # that has already been made.
      - name: Reconcile verdict labels with the board Status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          set -euo pipefail
          while IFS= read -r item; do
            status=$(jq -r '.status // empty' <<<"$item")
            issue_number=$(jq -r '.issue_number // empty' <<<"$item")
            [ -n "$issue_number" ] || continue
            case "$status" in
              "$STATUS_ACCEPTED_PARTIAL"|"$STATUS_ACCEPTED_FULL") want="pack:valid"; stale="pack:invalid" ;;
              "$STATUS_INVALID") want="pack:invalid"; stale="pack:valid" ;;
              *) continue ;;
            esac
            has_want=$(jq -r --arg l "$want" '((.labels // []) | index($l)) != null' <<<"$item")
            has_stale=$(jq -r --arg l "$stale" '((.labels // []) | index($l)) != null' <<<"$item")
            if [ "$has_want" = "true" ] && [ "$has_stale" = "false" ]; then
              continue
            fi
            echo "issue #$issue_number: board Status '$status' - applying $want, dropping $stale"
            gh issue edit "$issue_number" --repo "$REPO" --add-label "$want" --remove-label "$stale"
          done < <(jq -c '.items[]' board.json)

      - name: Recompute hash and diff against Pack Hash (fetch_pack.py + sha256sum only)
        id: diff
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          set -euo pipefail
          mismatched="[]"
          while IFS= read -r item; do
            # Normalized keys (pack_board_fields.py) with a `//` fallback
            # instead of direct indexing: a missing value becomes an empty
            # string and a skipped item, not a crash.
            status=$(jq -r '.status // empty' <<<"$item")
            case "$status" in
              "$STATUS_ACCEPTED_PARTIAL"|"$STATUS_ACCEPTED_FULL") ;;
              *) continue ;;
            esac

            issue_number=$(jq -r '.issue_number // empty' <<<"$item")
            stored_hash=$(jq -r '.pack_hash // empty' <<<"$item")
            if [ -z "$issue_number" ] || [ -z "$stored_hash" ]; then
              echo "::warning::item has no issue number or Pack Hash value - skipping defensively"
              continue
            fi

            body=$(gh issue view "$issue_number" --repo "$REPO" --json body -q '.body')
            pack_url=$(printf '%s\n' "$body" | grep -Eo 'https?://[^ ")]+' | sed -n '1p' || true)
            if [ -z "$pack_url" ]; then
              echo "::warning::issue #$issue_number has no detectable pack URL in the body - skipping"
              continue
            fi

            # scripts/fetch_pack.py re-applies the same host allow-list and
            # SSRF guard as community-pack-validate.yml's own download step
            # (defense in depth: if a host was later removed from the
            # allow-list, drift-check refuses to follow it too, instead of
            # blindly fetching whatever URL is sitting in the issue body) and
            # handles host-specific quirks like Google Drive's two-step
            # confirm-token download a plain HTTP client could not.
            rm -f drift_download.bin
            if ! python3 scripts/fetch_pack.py "$pack_url" drift_download.bin \
                --max-bytes "$MAX_PACK_BYTES" --allowlist scripts/pack_host_allowlist.json; then
              echo "::warning::issue #$issue_number - could not (re)download pack_url for drift check, skipping"
              continue
            fi
            fresh_hash=$(sha256sum drift_download.bin | cut -d' ' -f1)
            if [ "$fresh_hash" != "$stored_hash" ]; then
              gh issue comment "$issue_number" --repo "$REPO" \
                --body "the pack's content changed since the last validation — revalidating automatically"
              mismatched=$(jq -c --arg n "$issue_number" --arg u "$pack_url" \
                '. + [{"issue_number": ($n | tonumber), "pack_url": $u}]' <<<"$mismatched")
            fi
          done < <(jq -c '.items[]' board.json)

          echo "mismatched=$mismatched" >> "$GITHUB_OUTPUT"

  revalidate:
    needs: detect-drift
    if: needs.detect-drift.outputs.mismatched != '[]'
    permissions:
      contents: read
    strategy:
      matrix:
        item: ${{ fromJson(needs.detect-drift.outputs.mismatched) }}
    uses: ./.github/workflows/community-pack-validate.yml
    with:
      issue_number: ${{ matrix.item.issue_number }}
      pack_url: ${{ matrix.item.pack_url }}
      mode: revalidate
    secrets:
      PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
