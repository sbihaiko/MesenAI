name: Checks

# The always-on gate, split out of `build.yml` on 2026-09-14 (PR #230) when that
# file's `push`/`pull_request` triggers were removed and its 14-job binary
# matrix became dispatch-only.
#
# It is a separate workflow file rather than a job in `build.yml` on purpose.
# `build.yml`'s identity to the outside world is "the workflow whose newest run
# on `main` carries the downloadable binaries": the README's nightly.link URLs
# resolve against exactly that run. A push to `main` that ran an artifact-less
# job there would become the newest run and the download links would stop
# serving binaries until the next dispatch. Keeping artifact-free work in
# another file keeps that run a build. Same reason for the second half of the
# split: `cancel-in-progress` groups on workflow+ref, so a push to `main` during
# a dispatched build would have cancelled it.
#
# ADR-0200 (2026-09-16) added a `prod`-filtered `pull_request` to `build.yml`.
# The reasoning above is unaffected and that is why the trigger was safe to
# add: a pull request run executes at `refs/pull/N/merge`, which is neither
# `main` nor a ref a dispatch uses, so it can neither supersede the
# downloadable run nor cancel one.
#
# Phase 11 C.1 (2026-09-14) added the two jobs below `checks`. With the binary
# matrix on `workflow_dispatch`, nothing on a pull request compiled `Core/` any
# more (and `/W4 /WX` + `-Werror` there had caught the tileNearby bug twice on
# the very day the matrix was switched off), and nothing had ever run the
# `scripts/test_*.py` suite. They are separate jobs, not extra steps in
# `checks`, so the jobs run in parallel and a red one names which contract
# broke.
#
# ADR-0191 (2026-09-14) folded `unit-tests.yml`'s two jobs in here as
# `ui-tests` and `headless-ui-tests` and deleted that file, along with
# `tests.yml`. Both were `disabled_manually` on this repo and had produced no
# run since, so requiring their check names would have blocked every merge
# forever; as jobs of the always-on gate they report on every pull request.
# `tests.yml` was the Windows MSBuild + `PGOHelper citests` accuracy suite and
# has no Linux equivalent here - that coverage is gone until Windows returns to
# CI. Per the same ADR, CI compiles Linux only: the macOS release is built
# locally with `make release-macos`, and no job in this repository compiles C++
# on macOS or Windows.
#
# The trigger pair below is deliberate and was measured (ADR-0193, 2026-09-15).
# `pull_request` is the gate: it reports the five checks the `main` ruleset
# requires before the code can land. The `push` on `main` is NOT a duplicate of
# it - it is the only gate for what bypasses the PR path entirely:
#
#   - a direct push. The ruleset's `bypass_actors` lets an admin token through,
#     which is how a hand fix lands. (`community-pack-catalog.yml` used to
#     push this way; since #266 it opens a PR on chore/community-pack-catalog
#     instead — run 34953429060 showed PROJECT_PAT is not a bypass actor.)
#   - a merge-commit or rebase-merge onto a `main` that moved. That tree was
#     never the head `pull_request` tested, because the ruleset's
#     `strict_required_status_checks_policy` is false.
#
# Measured over the last 60 commits on `main`: 49 squash-merges, 7 PRs via
# merge-commit/rebase, 4 pushed straight to `main` with no PR at all. Removing
# this trigger to "cut the duplicate run" opens those 4 - none of them
# reviewed - plus every merge-commit tree, and the run costs nothing: the
# repository is public, so standard-runner minutes are not billed. Runs are two
# per merged PR, and during a burst of merges most of the `push` ones end
# `cancelled` (the concurrency group below is workflow+ref). Reopen the
# question only when one of those two paths stops existing (ADR-0193 §5).
#
# `make doc-checks` is the repo's own acceptance suite: the drift guardrails
# (ADR-0137, ADR-0138 §41), ADR-reference integrity, the community-pack pipeline
# verifiers, and the HD-pack and artist-kit script suites. It also compiles —
# `verify_smoke_pack_headless.sh` builds `scripts/headless_record` and FAILs here
# if it cannot — which is why the job installs SDL2. That is the core-only
# helper, not the GUI/LTO/AOT artifact `build.yml` produces.

on:
  # The gate. Reports the five required checks of the `main` ruleset.
  pull_request:
    branches:
      - 'main'
  # Not a duplicate of the above, and not to be removed to save a run: the
  # only gate for a direct push to `main` (admin bypass) and for a
  # merge-commit/rebase tree the PR never tested. See the header (ADR-0193).
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  checks:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy libsdl2-dev # scripts/headless_record (built by doc-checks) links the core, which needs SDL2
          python3 -m pip install --user PyYAML==6.0.3 Pillow==12.3.0 numpy==2.2.6 # numpy 2.3+ dropped Python 3.10 (ubuntu-22.04 runners) # doc-checks verify scripts need PyYAML/Pillow/numpy (not preinstalled everywhere)

      - name: Run doc checks
        run: make doc-checks

  # Every `scripts/test_*.py`, one process per file. Most of them carry their
  # own `main()` runner rather than `unittest.TestCase` subclasses, so
  # `unittest discover` collects a small fraction of the cases; the runner
  # loops over the files instead. Same Python deps as the `checks` job, minus
  # SDL2 (no compilation here). Measured 2026-09-14: 38 files, ~25 s.
  python-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy python3-tk # scripts/test_compose_editor_gui.py imports tkinter at module scope; without a DISPLAY it skips only its four windowed cases, but a missing module fails the import
          python3 -m pip install --user PyYAML==6.0.3 Pillow==12.3.0 numpy==2.2.6 # numpy 2.3+ dropped Python 3.10 (ubuntu-22.04 runners)

      - name: Run the Python suite
        run: make python-tests

  # The PR gate's compile of `Core/`. `make core-unit-tests` builds the listed
  # Core/Utilities translation units standalone (no InteropDLL, no MesenCore,
  # no SDL2, no ROM - the ADR-0131 invariants) with `-Wall -Werror`, then runs
  # the framework-free harness. A PR that breaks compilation, or introduces a
  # warning in a file on the CUTSRC list, fails here. Measured 2026-09-14:
  # ~13 s with -j8 locally, 771/771 cases.
  core-unit-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Compile and run the core unit tests
        run: make -j$(nproc) core-unit-tests

  # ADR-0191 (2026-09-14): folded in from the deleted `unit-tests.yml`, whose
  # two jobs were `disabled_manually` and therefore could never be required on
  # `main`. The invariants of ADR-0131 come with them unchanged: never link
  # `InteropDLL`/`MesenCore`, never require SDL2, never require a platform SDK
  # or a ROM corpus, and keep the `dotnet-version` pin at `10.x` (the same pin
  # `build.yml` uses; `dotnet-format-check.yml`'s `10.0.x` is a separate,
  # independent pin and is not tracked here).
  #
  # `make core-unit-tests` is NOT a step of this job: the `core-unit-tests` job
  # above already compiles and runs it, and duplicating it would pay for the
  # same compile twice and leave two check runs that fail for the same reason.
  ui-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Verify UI/Logic firewall
        # ADR-0123 (H5): fast pre-check naming the offending file/dependency;
        # the dual-compile below is still the authoritative gate.
        run: ./scripts/verify-ui-logic-firewall.sh

      - name: Run unit tests
        run: dotnet test UI.Tests/UI.Tests.csproj --nologo

  # ADR-0150 (accepted 2026-09-03): headless Avalonia XAML-wiring tests in a
  # separate project that references UI/UI.csproj. Kept as its own job - NOT a
  # step appended to ui-tests - so a headless-host failure never reds the cheap
  # host-free leg (ADR-0131's invariants for that job stay readable).
  # No MesenCore is built here (ADR-0131), so the MainWindow-backed cases
  # self-skip with an explicit reason via NativeCore.cs (Assert.SkipWhen); the
  # core-free wiring cases (PlayerSettingsTabs, ControllerHighlight) run. Run
  # `make core && make headless-ui-tests` locally to exercise all of them.
  # The RID is overridden from the command line because UI/UI.csproj hardcodes
  # <RuntimeIdentifier>win-x64</RuntimeIdentifier> (a global property wins over
  # the csproj assignment); linux-x64 matches the runner. That override is also
  # the known cross-RID `obj/` trap: a local run that built for osx-arm64
  # leaves artefacts a linux-x64 restore trips over, so a clean checkout (as
  # here) or `rm -rf UI.HeadlessTests/obj` is what makes the two agree.
  headless-ui-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Run headless UI wiring tests
        run: dotnet test UI.HeadlessTests/UI.HeadlessTests.csproj -p:RuntimeIdentifier=linux-x64 --nologo
